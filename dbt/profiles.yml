bixi_platform:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5434') | as_number }}"
      user: bixi
      password: "{{ env_var('DBT_PASSWORD', 'bixi') }}"
      dbname: bixi
      schema: analytics
      threads: 4