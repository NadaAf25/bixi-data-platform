services:
  postgres:
    image: postgres:16
    container_name: bixi-postgres
    environment:
      POSTGRES_USER: bixi
      POSTGRES_PASSWORD: bixi
      POSTGRES_DB: bixi
    ports:
      - "5434:5432"
    volumes:
      - bixi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bixi -d bixi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bixi_pgdata: