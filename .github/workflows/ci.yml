name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dbt
        run: pip install dbt-core==1.12.7 dbt-postgres==1.11.0
      - name: Parse the dbt project
        run: dbt parse
        working-directory: dbt
